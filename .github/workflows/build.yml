name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A same-repo pull request fires both `push` and `pull_request`, so without this
# every commit on a PR branch builds twice on a Windows runner — which bills at ten
# times the Linux rate. Superseded runs are cancelled for the same reason.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    # Only the release step needs more than read access, and it needs exactly this:
    # a repository whose default token is read-only fails at the last step of a tag
    # build, after twenty minutes of work, with nothing published.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The self-contained publish pulls the whole win-x64 runtime pack on every run.
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore SoulRemote.sln

      - name: Build
        run: dotnet build SoulRemote.sln -c Release --no-restore

      # The core is plain net8.0 precisely so this step can exist. It covers the bot's
      # dispatch, the Telegram client, settings, the file browser and the string
      # catalogue — everything that used to be untestable behind WPF.
      - name: Test
        run: dotnet test SoulRemote.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

      # The worker deployed by the app is embedded straight from cloudflare/worker.js,
      # so a syntax error there ships silently and only fails at the edge.
      - name: Check the worker parses
        run: node --check cloudflare/worker.js

      # A missing StaticResource throws when a page is first shown, and a binding to a
      # property that does not exist fails silently. The compiler catches neither, and
      # the tests deliberately do not depend on Windows, so this closes the gap.
      - name: Check the XAML resolves
        run: python tools/check-xaml.py

      # A tagged build stamps its own version; every other build stays at the csproj
      # default. GitHub's expression language has no substring, so the "v" prefix is
      # trimmed here rather than inline.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            "${{ github.ref_name }}".Substring(1)
          } else { "1.0.0" }
          "value=$version" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Publish (self-contained x64)
        run: >
          dotnet publish src/SoulRemote/SoulRemote.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      # Handed round by Telegram rather than downloaded from a store, this binary needs
      # a checksum its recipients can actually check.
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/SoulRemote.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SoulRemote.exe" | Out-File -Encoding ascii publish/SoulRemote.exe.sha256
          Write-Host "SHA-256: $hash"


      # Packaging costs a couple of minutes on a Windows runner, so it runs where it
      # earns that: on main, on a tag, and on demand. A pull request still gets the
      # build, the tests and the two static checks above.
      - name: Install WiX
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2

      # -PackageOnly reuses the exe published above. The packages a release ships are
      # therefore built by the same script a developer runs, rather than by a second
      # copy of the recipe living in this file and drifting away from it.
      - name: Package (MSI and setup.exe)
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        shell: powershell
        run: .\tools\build-installer.ps1 -Version ${{ steps.version.outputs.value }} -PackageOnly

      # The one guarantee people actually rely on: an upgrade must not touch the
      # settings, tokens and paired chats under %APPDATA%. -Install installs the
      # package, plants sentinel files, upgrades over the top and uninstalls, checking
      # the sentinels byte for byte at each step. It needs a machine nobody minds it
      # installing on, which is exactly what a runner is.
      - name: Check that user data survives an upgrade
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        shell: powershell
        run: .\tools\check-data-survives.ps1 -Install

      - name: Upload installers
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: SoulRemote-installers
          path: |
            dist/*.msi
            dist/*.msi.sha256
            dist/*Setup.exe
            dist/*Setup.exe.sha256
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulRemote-win-x64
          path: |
            publish/SoulRemote.exe
            publish/SoulRemote.exe.sha256
          if-no-files-found: error

      # A tag turns the same artefacts into something anyone can download without a
      # GitHub account, and that does not expire after ninety days.
      #
      # The .sha256 files are not decoration here. The app updates itself from this
      # release, and it refuses to run an installer whose published checksum it cannot
      # match - so a release published without them is a release nobody updates to.
      # SoulRemote-<version>-Setup.exe is the asset the updater looks for first.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SoulRemote-*-Setup.exe
            dist/SoulRemote-*-Setup.exe.sha256
            dist/SoulRemote-*-x64.msi
            dist/SoulRemote-*-x64.msi.sha256
            publish/SoulRemote.exe
            publish/SoulRemote.exe.sha256
          generate_release_notes: true
